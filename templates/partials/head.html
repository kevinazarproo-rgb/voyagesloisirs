<!doctype html>
<html lang="fr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" type="image/svg+xml" href="{{root}}assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}assets/css/carnet.css">
<link rel="stylesheet" href="{{root}}assets/css/print.css" media="print">
<meta property="og:type" content="website"><meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:image" content="{{image}}">
<!-- canonical et og:url : à ajouter quand `baseUrl` sera renseigné dans data/site.js [domaine à confirmer par l’agence] -->
<script>document.documentElement.classList.remove('no-js');try{var s=localStorage;if(s.getItem('carnet-texte')==='1')document.documentElement.classList.add('texte-grand');if(s.getItem('carnet-motion')==='1')document.documentElement.classList.add('motion-off')}catch(e){}</script>
</head>
