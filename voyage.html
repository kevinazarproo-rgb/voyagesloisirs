<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b67">
  <title>Voyage | Voyages Loisirs by Aya</title>
  <style>
    :root{--navy:#102b67;--deep:#081b47;--orange:#f47716;--ink:#18243b;--muted:#65718a;--paper:#f7f8fb;--line:#e8ebf1}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:85px}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.header{height:76px;position:sticky;top:0;z-index:3;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.header-in{height:100%;display:flex;align-items:center;justify-content:space-between}.brand img{display:block;width:165px;height:58px;object-fit:contain}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:999px;background:var(--orange);color:white;padding:14px 20px;font-weight:750;cursor:pointer}.btn:hover{background:#df6108}.back{font-size:13px;font-weight:700;color:white}.hero{min-height:425px;position:relative;display:flex;align-items:end;color:white;background:var(--navy);background-position:center;background-size:cover}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#081b47ed,#102b67a8 65%,#102b6733)}.hero-content{position:relative;padding-top:65px;padding-bottom:48px}.hero h1{max-width:850px;margin:16px 0;font-size:clamp(38px,6vw,62px);line-height:1.02;letter-spacing:-.045em}.eyebrow{color:var(--orange);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero .eyebrow{color:#ffad6a}.lead{max-width:720px;color:#f0f3fa;font-size:16px;line-height:1.75}.pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:21px}.pill{border-radius:30px;background:#ffffff2b;padding:9px 13px;font-size:12px;font-weight:700}.main{padding:52px 0 65px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;align-items:start;gap:36px}.section-title{margin:9px 0 20px;color:var(--navy);font-size:clamp(28px,3.5vw,39px);line-height:1.1;letter-spacing:-.04em}.highlights{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.highlight{display:flex;gap:11px;align-items:flex-start;border-radius:15px;background:var(--paper);padding:15px;font-size:13px;line-height:1.6;font-weight:600}.number{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#fff0e4;color:var(--orange);font-size:12px;font-weight:800}.itinerary{margin-top:47px}.day{position:relative;display:grid;grid-template-columns:40px 1fr;gap:15px;padding-bottom:25px}.day:not(:last-child):before{content:"";position:absolute;top:39px;bottom:0;left:19px;width:1px;background:#dce1eb}.day-no{position:relative;z-index:1;width:39px;height:39px;display:grid;place-items:center;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:800}.day-label{color:var(--orange);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.day h3{margin:4px 0;color:var(--navy);font-size:17px}.day p{margin:7px 0 0;color:#58647a;font-size:13px;line-height:1.75}.lists{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.list-box{border:1px solid var(--line);border-radius:16px;padding:19px}.list-box h3{margin:0 0 13px;color:var(--navy);font-size:16px}.list-box ul{display:grid;gap:9px;margin:0;padding:0;list-style:none}.list-box li{display:flex;gap:8px;color:#58647a;font-size:12px;line-height:1.6}.ok{color:#16a06a}.no{color:var(--orange)}.aside{position:sticky;top:96px;border:1px solid var(--line);border-radius:20px;background:white;padding:21px;box-shadow:0 12px 36px #102b6712}.price-caption{color:var(--muted);font-size:12px;font-weight:600}.price{margin:4px 0;color:var(--navy);font-size:36px;font-weight:800}.aside-note{color:var(--muted);font-size:11px;line-height:1.6}.aside .btn{width:100%;margin-top:15px;font-size:13px}.aside-divider{height:1px;background:var(--line);margin:20px 0}.aside h3{margin:0 0 12px;color:var(--navy);font-size:15px}.date{margin-top:9px;border-radius:12px;background:var(--paper);padding:12px}.date strong{display:block;font-size:12px}.date span{display:block;margin-top:5px;color:#58647a;font-size:12px}.date small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.contact{background:var(--paper);padding:57px 0}.contact-grid{display:grid;grid-template-columns:.75fr 1.25fr;gap:35px}.contact h2{margin:9px 0;color:var(--navy);font-size:34px;line-height:1.08}.contact-copy{color:#58647a;font-size:13px;line-height:1.8}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px;border-radius:19px;background:white;padding:23px}.form label{color:#38445d;font-size:11px;font-weight:700}.form input,.form select,.form textarea{width:100%;margin-top:7px;border:1px solid #dce2ec;border-radius:10px;padding:11px;background:#fff;font:inherit;font-size:13px}.form textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.hint{margin:0;color:var(--muted);font-size:10px;line-height:1.6}.footer{background:var(--navy);color:#dce7ff;padding:28px 0;font-size:11px}.footer-in{display:flex;justify-content:space-between;gap:15px}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.aside{position:static;grid-row:1}.contact-grid{grid-template-columns:1fr}}@media(max-width:560px){.wrap{width:calc(100% - 30px)}.header{height:66px}.brand img{width:140px}.header-in>.btn{padding:11px 13px;font-size:11px}.hero{min-height:390px}.hero-content{padding-bottom:35px}.hero h1{font-size:42px}.main{padding:38px 0}.highlights,.lists,.form{grid-template-columns:1fr}.full{grid-column:auto}.contact{padding:42px 0}.footer-in{flex-direction:column}}
  </style>

<body>
  <header class="header"><div class="wrap header-in"><a class="brand" href="index.html#voyages"><img src="public/logo-voyages-loisirs.jpeg" alt="Voyages Loisirs by Aya"></a><a class="btn" href="#demande">Demander une réservation <span>↗</span></a></div></header>
  <main id="app"></main>
  <footer class="footer"><div class="wrap footer-in"><span>© 2026 Voyages Loisirs by Aya</span><span>Dates et tarifs à confirmer auprès de l’agence.</span><a href="index.html#voyages">← Tous les voyages</a></div></footer>
  <script>
    const trips={
      chine:{title:'La Chine : escapade au pays du dragon',country:'Chine',category:'Culture & patrimoine',duration:'10 jours / 9 nuits',minimum:10,price:2300,image:'https://images.unsplash.com/photo-1508804185872-d7badad00f7d?auto=format&fit=crop&w=1800&q=85',excerpt:'De la Cité interdite à la Grande Muraille, découvrez trois villes et trois visages d’un même empire.',highlights:['Cité interdite et Temple du Ciel','Grande Muraille à Mutianyu','Armée en terre cuite de Xi’an','Calligraphie et dégustation de thé'],dates:[['10/05/2027','18/05/2027',2300,250],['01/10/2027','09/10/2027',2400,250]],days:[['Jour 1','Paris / Pékin','Envol pour Pékin et nuit à bord.'],['Jour 2','Pékin','Accueil par votre guide francophone. Découverte des bâtiments olympiques, du Nid d’Oiseau et du Water Cube. Transfert à l’hôtel, dîner local et nuit à l’hôtel.'],['Jour 3','Pékin','Découverte de la place Tian’anmen et du Palais impérial, puis visite du Temple du Ciel. Dégustation dans une maison de thé.'],['Jour 4','Pékin – Grande Muraille','Excursion à la Grande Muraille, section de Mutianyu. Retour par le Palais d’Été et ses pavillons.'],['Jour 5','Pékin / Xi’an','Visite du quartier de Gulou, puis train de nuit vers Xi’an.'],['Jour 6','Xi’an','Découverte de l’Armée en terre cuite, puis de la Grande Pagode de l’Oie sauvage et initiation à la calligraphie.'],['Jour 7','Xi’an / Shanghai','Promenade dans le quartier musulman et transfert vers Shanghai.'],['Jour 8','Shanghai / Luzhi / Suzhou / Shanghai','Découverte du village d’eau de Luzhi et de Suzhou, ses jardins et ses canaux.'],['Jour 9','Shanghai / Paris','Visite de Shanghai, du jardin Yu et du Temple du Bouddha de Jade. Transfert à l’aéroport et vol retour.'],['Jour 10','Arrivée à Paris','Arrivée en France selon les horaires de vol.']],included:['Vol international au départ de Paris, avec ou sans escale','Transferts aéroport / hôtel / aéroport','6 nuits en hôtel avec petits-déjeuners et 1 nuit en train','Train de nuit Pékin / Xi’an en couchette molle','Vol intérieur Xi’an / Shanghai','Guides locaux francophones','Entrées des visites mentionnées','Autocar climatisé avec chauffeur','Taxe de solidarité'],excluded:['Forfait Dragon : 250 €','Pourboires guides et chauffeurs','Assurances facultatives','Dépenses personnelles']},
      pologne:{title:'Pologne : entre capitales et héritages',country:'Pologne',category:'Culture & patrimoine',duration:'7 jours / 6 nuits',minimum:10,price:1700,image:'https://images.unsplash.com/photo-1519197924294-4ba991a11128?auto=format&fit=crop&w=1800&q=85',excerpt:'Deux villes reliées par le train à grande vitesse pour découvrir un pays reconstruit pierre par pierre.',highlights:['Varsovie et Cracovie classées à l’UNESCO','Mine de sel de Wieliczka','Train grande vitesse Varsovie–Cracovie','Guide francophone pendant le séjour'],dates:[['08/04/2027','12/04/2027',1700,280],['05/10/2027','11/10/2027',1750,280]],days:[['Jour 1','Varsovie','Accueil par le guide, tour panoramique de la capitale et première découverte de la vieille ville.'],['Jour 2','Varsovie','Visite guidée de la vieille ville, du Château royal, de la place du marché et du parc Łazienki.'],['Jour 3','Varsovie','Musée de l’Histoire des Juifs polonais POLIN et Monument des Héros du ghetto. Après-midi libre.'],['Jour 4','Varsovie / Wieliczka / Cracovie','Train vers Cracovie et visite de la mine de sel de Wieliczka, classée à l’UNESCO.'],['Jour 5','Cracovie','Visite de la vieille ville, de la colline du Wawel et de la place du marché.'],['Jour 6','Cracovie / Auschwitz / Cracovie','Visite du site mémorial d’Auschwitz-Birkenau, puis découverte du quartier de Kazimierz.'],['Jour 7','Cracovie / Paris','Temps libre puis transfert à l’aéroport pour le vol retour.']],included:['Vol international au départ de Paris','Transferts aéroport / hôtel / aéroport','Logement en hôtels 3 étoiles','Pension complète','Train grande vitesse Varsovie–Cracovie en 2e classe','Guide accompagnateur francophone','Audioguides du 2e au 6e jour','Entrées mentionnées au programme'],excluded:['Forfait Chopin : 70 € par personne','Boissons et dépenses personnelles','Pourboires guide et chauffeur','Assurances facultatives']},
      panama:{title:'Le Panama : trait d’union des Amériques',country:'Panama',category:'Nature & découverte',duration:'10 jours / 9 nuits',price:3500,image:'https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?auto=format&fit=crop&w=1800&q=85',excerpt:'Un canal légendaire, une jungle vivante et deux océans : un voyage entre nature et culture.',highlights:['Écluses de Miraflores et canal de Panama','Rencontre avec la communauté Emberá','Île de Taboga','3 nuits en tout inclus face au Pacifique'],dates:[['13/02/2027','22/02/2027',3650,550],['13/11/2027','22/11/2027',3500,525]],days:[['Jour 1','Arrivée à Panama','Accueil à l’aéroport de Tocumen et transfert privé. Installation à l’hôtel et dîner libre.'],['Jour 2','Panama – la ville et le canal','Panorama de la ville moderne, marché de fruits de mer, découverte du Casco Viejo et des écluses de Miraflores.'],['Jour 3','San Lorenzo & Agua Clara','Découverte de la côte caraïbe, du patrimoine de San Lorenzo et des écluses d’Agua Clara.'],['Jour 4','Communauté indigène Emberá','Remontée de la rivière Chagres en pirogue et rencontre avec la communauté Emberá.'],['Jour 5','Soberanía & lac Gatún','Parc national de Soberanía, promenade en bateau sur le lac Gatún et observation de la faune.'],['Jour 6','Panama, journée libre','Journée libre pour profiter du resort et de la formule tout inclus.'],['Jour 7','Ferme d’ananas & El Valle','Découverte d’une ferme d’ananas puis route vers El Valle de Antón et son village installé dans un cratère volcanique.'],['Jour 8','El Valle / Santa Clara','Découverte du marché artisanal et transfert vers la côte Pacifique.'],['Jour 9','Santa Clara','Journée libre pour profiter du resort et de la formule tout inclus.'],['Jour 10','Santa Clara / départ','Petit-déjeuner, transfert à l’aéroport et vol retour.']],included:['Vol international au départ de Paris avec escale','Hébergements mentionnés','Guide francophone les jours 2, 3, 4, 5, 7 et 8','Demi-pension et déjeuners inclus certains jours','Excursions, visites et entrées aux parcs nationaux','Transferts en véhicule privé et en bateau'],excluded:['Forfait Jungle : 350 € par personne','Assurances','Pourboires','Boissons']},
      'chateau-avesnes':{title:'Le Château d’Avesnes – Le Castelet',country:'Normandie, France',category:'Escapade & détente',duration:'2 jours / 1 nuit',price:null,image:'https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=1800&q=85',excerpt:'Un château de 1862 au cœur de 18 hectares de nature, à 1 h 30 de Paris.',highlights:['Parc, verger et forêt sur 18 hectares','Spa et détente','Table d’hôtes et produits locaux','Gournay-en-Bray et villages de Normandie à proximité'],dates:[],days:[['Jour 1','Arrivée au Castelet','Installation et découverte du domaine, de ses jardins et des environs.'],['Jour 2','Nature et patrimoine','Profitez du domaine et découvrez les villages, jardins et sites patrimoniaux alentour.']],included:['Séjour au Château d’Avesnes selon la formule choisie'],excluded:['Tarifs et prestations à confirmer auprès de l’agence']},
      crete:{title:'La Crète éternelle',country:'Grèce',category:'Culture & soleil',duration:'8 jours / 7 nuits',minimum:10,price:1850,image:'https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1800&q=85',excerpt:'Palais minoens, gorges et monastères : d’Héraklion à Spinalonga, découvrez le berceau d’une civilisation.',highlights:['Knossos et le musée d’Héraklion','Forteresse de Spinalonga','Leçon de cuisine crétoise à Thronos','Dégustation de vins au monastère d’Agia Triada'],dates:[['08/06/2027','15/07/2027',1950,250],['08/10/2027','15/10/2027',1850,250]],days:[['Jour 1','Arrivée en Crète','Accueil à l’aéroport d’Héraklion, transfert à l’hôtel et temps libre.'],['Jour 2','Armeni / Kourtaliotiko / Plakias / Réthymnon','Découverte de sites minoens, des gorges de Kourtaliotiko et de la ville de Réthymnon.'],['Jour 3','Jardin botanique / Agia Triada / La Canée','Balade au jardin botanique, visite du monastère d’Agia Triada et découverte de La Canée.'],['Jour 4','Arkadi / Thronos / Margarites','Visite du monastère d’Arkadi, leçon de cuisine crétoise et découverte d’artisans potiers.'],['Jour 5','Héraklion / Archanes / Knossos','Découverte d’Héraklion, de ses trésors archéologiques et du palais de Knossos.'],['Jour 6','Gortyne / Messara / Matala','Découverte de Gortyne, de la plaine de Messara et du village côtier de Matala.'],['Jour 7','Kritsa / Lato / Spinalonga','Visite de Kritsa et de Lato, puis découverte de l’île forteresse de Spinalonga.'],['Jour 8','Héraklion / Paris','Temps libre selon l’horaire du vol, transfert à l’aéroport et retour en France.']],included:['Vol aller-retour au départ de Paris','Taxes d’aéroport','Transferts aéroport / hôtel / aéroport','7 nuits en hôtel, chambre double','Les repas mentionnés au programme','Guide francophone pendant le circuit','Transport en autocar climatisé','Entrées et visites mentionnées'],excluded:['Taxe de séjour à régler sur place','Repas et boissons non mentionnés','Pourboires','Assurances annulation et assistance','Dépenses personnelles']}
    };
    const slug=new URLSearchParams(location.search).get('slug'),t=trips[slug],app=document.getElementById('app'),money=n=>new Intl.NumberFormat('fr-FR').format(n)+' €';
    if(!t){app.innerHTML='<section class="wrap" style="padding:90px 0"><h1>Voyage introuvable</h1><a class="btn" href="index.html#voyages">Retour aux voyages</a></section>'}else{
      document.title=t.title+' | Voyages Loisirs by Aya';
      const days=t.days.map((d,i)=>`<article class="day"><span class="day-no">${String(i+1).padStart(2,'0')}</span><div><span class="day-label">${d[0]}</span><h3>${d[1]}</h3><p>${d[2]}</p></div></article>`).join('');
      const dates=t.dates.length?t.dates.map(d=>`<div class="date"><strong>${d[0]} – ${d[1]}</strong><span>${money(d[2])} / pers.</span><small>Supplément chambre single : ${money(d[3])}</small></div>`).join(''):'<p class="aside-note">Dates et tarifs à confirmer auprès de l’agence.</p>';
      const list=(items,cls)=>items.map(x=>`<li><span class="${cls}">${cls==='ok'?'✓':'•'}</span><span>${x}</span></li>`).join('');
      app.innerHTML=`<section class="hero" style="background-image:url('${t.image}')"><div class="wrap hero-content"><a class="back" href="index.html#voyages">← Tous les voyages</a><p class="eyebrow">${t.country} · ${t.category}</p><h1>${t.title}</h1><p class="lead">${t.excerpt}</p><div class="pills"><span class="pill">◷ ${t.duration}</span>${t.minimum?`<span class="pill">Minimum ${t.minimum} personnes</span>`:''}</div></div></section>
      <section class="main"><div class="wrap layout"><div><p class="eyebrow">L’expérience</p><h2 class="section-title">Les temps forts du voyage</h2><div class="highlights">${t.highlights.map((h,i)=>`<div class="highlight"><span class="number">${i+1}</span><span>${h}</span></div>`).join('')}</div><div class="itinerary"><p class="eyebrow">Votre itinéraire</p><h2 class="section-title">Le programme jour par jour</h2>${days}</div><div class="lists"><section class="list-box"><h3>Le prix comprend</h3><ul>${list(t.included,'ok')}</ul></section><section class="list-box"><h3>Le prix ne comprend pas</h3><ul>${list(t.excluded,'no')}</ul></section></div></div>
      <aside class="aside"><div class="price-caption">${t.price?'À partir de / personne':'Tarif'}</div><div class="price">${t.price?money(t.price):'Sur demande'}</div><p class="aside-note">Tarifs indicatifs. Le prix dépend de la date et des conditions du séjour.</p><a class="btn" href="#demande">Demander une réservation →</a><div class="aside-divider"></div><h3>Dates de départ</h3>${dates}</aside></div></section>
      <section class="contact" id="demande"><div class="wrap contact-grid"><div><p class="eyebrow">Votre prochain départ</p><h2>Demandez votre réservation.</h2><p class="contact-copy">Indiquez vos coordonnées et vos préférences. L’agence pourra revenir vers vous pour confirmer les disponibilités et le tarif définitif.</p></div><form class="form" id="request"><label>Nom et prénom *<input name="name" required placeholder="Votre nom"></label><label>Adresse e-mail *<input name="email" type="email" required placeholder="vous@exemple.fr"></label><label>Téléphone<input name="phone" type="tel" placeholder="Votre numéro"></label><label>Voyage souhaité *<input name="trip" required value="${t.title}"></label><label>Date de départ souhaitée<input name="departure" placeholder="Ex. octobre 2027"></label><label>Nombre de voyageurs<select name="people"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label class="full">Votre message<textarea name="message" placeholder="Précisez vos questions ou préférences…"></textarea></label><button class="btn full" type="submit">Préparer ma demande →</button><p class="hint full">Aucune réservation n’est confirmée à ce stade. Le tarif et les disponibilités doivent être confirmés par l’agence.</p></form></div></section>`;
      document.getElementById('request').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget),subject=encodeURIComponent('Demande de réservation — '+d.get('trip')),body=encodeURIComponent(`Bonjour Voyages Loisirs by Aya,\n\nJe souhaite obtenir des informations sur ce voyage.\n\nNom : ${d.get('name')}\nEmail : ${d.get('email')}\nTéléphone : ${d.get('phone')||'Non renseigné'}\nVoyage : ${d.get('trip')}\nDate souhaitée : ${d.get('departure')||'Flexible'}\nNombre de voyageurs : ${d.get('people')}\nMessage : ${d.get('message')||'Aucun message'}\n\nMerci.`);location.href=`mailto:reservation@ayavoyages.fr?subject=${subject}&body=${body}`});
    }
    if(t){
      const departures=[...document.querySelectorAll('.aside .date')];
      if(slug==='chine'){departures.forEach(item=>item.remove());document.querySelector('.aside h3').insertAdjacentHTML('afterend','<p class="aside-note">Dates à confirmer auprès de l’agence.</p>')}
      if(slug==='pologne'||slug==='crete')departures[0]?.remove();
      document.querySelector('.contact-grid > div').insertAdjacentHTML('beforeend','<p class="contact-copy"><strong>Contact réservation</strong><br><a href="tel:+33142686806">01 42 68 68 06</a><br><a href="mailto:reservation@ayavoyages.fr">reservation@ayavoyages.fr</a></p>');
      const form=document.getElementById('request');form.addEventListener('submit',event=>{event.preventDefault();event.stopImmediatePropagation();const d=new FormData(form),subject=encodeURIComponent('Demande de réservation — '+d.get('trip')),body=encodeURIComponent(`Bonjour Aya Voyages,\n\nNom : ${d.get('name')}\nE-mail : ${d.get('email')}\nTéléphone : ${d.get('phone')||'Non renseigné'}\nVoyage : ${d.get('trip')}\nDate souhaitée : ${d.get('departure')||'Flexible'}\nVoyageurs : ${d.get('people')}\nMessage : ${d.get('message')||'Aucun message'}\n\nMerci.`);location.href=`mailto:reservation@ayavoyages.fr?subject=${subject}&body=${body}`},true);
      document.querySelector('.footer-in').innerHTML='<span>© 2026 Voyages Loisirs by Aya</span><span><a href="tel:+33142686806">01 42 68 68 06</a> · <a href="mailto:reservation@ayavoyages.fr">reservation@ayavoyages.fr</a></span><span><a href="mentions-legales.html">Mentions légales</a> · <a href="cookies.html">Cookies</a></span><span><a href="index.html#voyages">← Tous les voyages</a></span>';
    }
  </script>
</body>
</html>
